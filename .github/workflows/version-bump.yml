name: Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version (overrides bump), e.g. 1.2.3"
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Bump project version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # For automatic runs on push to master we infer bump type from commit messages.
          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              subjects=$(git log --format=%s -n 50)
              bodies=$(git log --format=%b -n 50)
            elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              subjects=$(git log --format=%s "${BEFORE_SHA}..${CURRENT_SHA}")
              bodies=$(git log --format=%b "${BEFORE_SHA}..${CURRENT_SHA}")
            else
              echo "Warning: before SHA is not available locally, fallback to recent commits"
              subjects=$(git log --format=%s -n 50)
              bodies=$(git log --format=%b -n 50)
            fi

            bump_type="patch"
            if echo "${subjects}" | grep -Eiq '^[a-z]+(\([^)]+\))?!:' || echo "${bodies}" | grep -Eiq 'BREAKING CHANGE'; then
              bump_type="major"
            elif echo "${subjects}" | grep -Eiq '^feat(\([^)]+\))?:'; then
              bump_type="minor"
            fi

            echo "Detected bump type: ${bump_type}"
            uv version --bump "${bump_type}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            uv version "$INPUT_VERSION"
          else
            uv version --bump "${INPUT_BUMP:-patch}"
          fi

      - name: Read new version
        id: new_version
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 1
          fi

          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD
          git push origin "v${VERSION}"
