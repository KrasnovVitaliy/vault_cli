[project]
name = "vault-cli"
version = "0.1.0"
description = "CLI for listing and managing HashiCorp Vault KV v2 secrets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hvac>=2.4.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.3",
]

[project.scripts]
vault_cli = "app.main:app"
vault-cli = "app.main:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
